services:
  - type: web
    name: bibliokudo-conan-addon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # After first deploy, set to https://<service>.onrender.com
      - key: PUBLIC_URL
        sync: false

